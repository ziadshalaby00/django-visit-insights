[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-visit-insights"
version = "0.1.0"
description = "Lightweight, cache-first visit tracking for Django with a live dashboard and a simple API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ziad Ahmed Shalaby" },
]
keywords = ["django", "visits", "analytics", "counter", "cache", "insights"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/ziad-shalaby/django-visit-insights"
Source = "https://github.com/ziad-shalaby/django-visit-insights"
Issues = "https://github.com/ziad-shalaby/django-visit-insights/issues"

[tool.setuptools.packages.find]
include = ["visit_insights*"]

[tool.setuptools.package-data]
visit_insights = [
    "templates/**/*.html",
    "static/**/*",
]
